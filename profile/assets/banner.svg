<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Karlsen — GPU-friendly BlockDAG powering decentralized AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a2e"/>
      <stop offset="1" stop-color="#14304f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fd1c5"/>
      <stop offset="1" stop-color="#63b3ed"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <style>
      .t { font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
      .flow { stroke-dasharray: 6 10; animation: dash 3s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -64; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>

  <!-- Title block -->
  <text x="64" y="120" class="t" font-size="64" font-weight="700" fill="#ffffff">Karlsen</text>
  <text x="64" y="162" class="t" font-size="22" fill="#a0b4cc">GPU-friendly, ASIC-resistant BlockDAG</text>
  <text x="64" y="192" class="t" font-size="22" fill="url(#accent)" font-weight="600">Mine blocks. Serve AI. Earn $KLS.</text>

  <!-- Key facts -->
  <g class="t" font-size="15" fill="#cfe0f2">
    <rect x="64" y="226" width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#4fd1c5" stroke-opacity="0.5"/>
    <text x="139" y="248" text-anchor="middle">GHOSTDAG</text>
    <rect x="226" y="226" width="170" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#4fd1c5" stroke-opacity="0.5"/>
    <text x="311" y="248" text-anchor="middle">KarlsenHashV2</text>
    <rect x="408" y="226" width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#4fd1c5" stroke-opacity="0.5"/>
    <text x="483" y="248" text-anchor="middle">Written in Rust</text>
  </g>
  <text x="64" y="320" class="t" font-size="16" fill="#7f97b3">karlsencoin.org  ·  ai.karlsencoin.org  ·  explorer.karlsencoin.org</text>

  <!-- Ecosystem map: central chain node with satellites -->
  <g transform="translate(930,200)">
    <g stroke="url(#accent)" stroke-width="2" fill="none" class="flow">
      <line x1="0" y1="0" x2="-200" y2="-110"/>
      <line x1="0" y1="0" x2="0" y2="-140"/>
      <line x1="0" y1="0" x2="200" y2="-110"/>
      <line x1="0" y1="0" x2="-200" y2="110"/>
      <line x1="0" y1="0" x2="0" y2="140"/>
      <line x1="0" y1="0" x2="200" y2="110"/>
    </g>

    <circle r="58" fill="#0b1a2e" stroke="url(#accent)" stroke-width="3"/>
    <circle r="72" fill="none" stroke="#4fd1c5" stroke-opacity="0.35" class="pulse"/>
    <text y="-4" text-anchor="middle" class="t" font-size="17" font-weight="700" fill="#ffffff">BlockDAG</text>
    <text y="18" text-anchor="middle" class="t" font-size="13" fill="#a0b4cc">rusty-karlsen</text>

    <g class="t" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">
      <g transform="translate(-200,-110)"><rect x="-70" y="-20" width="140" height="40" rx="10" fill="#1c3a5e" stroke="#63b3ed" stroke-opacity="0.6"/><text y="5">GPU Mining</text></g>
      <g transform="translate(0,-140)"><rect x="-70" y="-20" width="140" height="40" rx="10" fill="#1c3a5e" stroke="#63b3ed" stroke-opacity="0.6"/><text y="5">KarlsenAI</text></g>
      <g transform="translate(200,-110)"><rect x="-70" y="-20" width="140" height="40" rx="10" fill="#1c3a5e" stroke="#63b3ed" stroke-opacity="0.6"/><text y="5">Wallet</text></g>
      <g transform="translate(-200,110)"><rect x="-70" y="-20" width="140" height="40" rx="10" fill="#1c3a5e" stroke="#63b3ed" stroke-opacity="0.6"/><text y="5">Explorer</text></g>
      <g transform="translate(0,140)"><rect x="-70" y="-20" width="140" height="40" rx="10" fill="#1c3a5e" stroke="#63b3ed" stroke-opacity="0.6"/><text y="5">wKLS Bridge</text></g>
      <g transform="translate(200,110)"><rect x="-70" y="-20" width="140" height="40" rx="10" fill="#1c3a5e" stroke="#63b3ed" stroke-opacity="0.6"/><text y="5">KarlsenChange</text></g>
    </g>
  </g>
</svg>
